		document.addEventListener('click', function (e) {
		  var link = e.target.closest('a');
		  if (!link || !link.href) return;
		
		  var platforms = [
		    { match: 'open.spotify.com',        name: 'Spotify' },
		    { match: 'music.apple.com',         name: 'AppleMusic' },
		    { match: 'chaosthrash.bandcamp.com',name: 'Bandcamp' },

		    { match: 'music.amazon',            name: 'AmazonMusic' },
		    { match: 'deezer.com',              name: 'Deezer' }
		  ];
		
		  for (var i = 0; i < platforms.length; i++) {
		    if (link.href.indexOf(platforms[i].match) !== -1) {
		      if (typeof fbq === 'function') {
		        fbq('trackCustom', 'StreamClick', { platform: platforms[i].name });
		        // Also fire a standard "Lead" event so it's usable as a
		        // conversion objective inside Ads Manager without extra setup
		        fbq('track', 'Lead', { content_name: platforms[i].name });
		      }
		      break;
		    }
		  }
		});
