     <script>

        //*** General Modal Functions ***//
        function modalOpen(sModalQuery) {
            var eModal = document.querySelector(sModalQuery);
            if (eModal) eModal.style.display = 'block';
        }

        function modalClose(sModalQuery) {
            var eModal = document.querySelector(sModalQuery);
            if (eModal) eModal.style.display = 'none';
        }

        function modalsClose() {
            // Set event listener for manage privacy buttons
            var aModals = document.querySelectorAll('.modal-container');
            for (var i = 0; i < aModals.length; i++) aModals[i].style.display = 'none';
        }

        // Set event listener for closing modals on click outside
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-container')) modalsClose();
            if (e.target.classList.contains('modal-close')) modalsClose();
            if (e.target.classList.contains('modal-close-button')) modalsClose();
        });

        // On Page Load -- Send link view (deduplicated with localStorage)
        (function() {
            var linkId = '69e60a3f6dc1188b76c3e881';
            var storageKey = 'lt_viewed_' + linkId;
            var now = Date.now();
            var fiveMinutes = 5 * 60 * 1000; // 5 minutes in milliseconds
            
            try {
                var lastViewed = localStorage.getItem(storageKey);
                
                // Only count view if never viewed or last view was more than 5 minutes ago
                if (!lastViewed || (now - parseInt(lastViewed, 10)) > fiveMinutes) {
                    ajaxGET("https://" + window.location.hostname + "/v/id/" + linkId);
                    localStorage.setItem(storageKey, now.toString());
                }
            } catch (e) {
                // localStorage not available, fall back to always tracking
                ajaxGET("https://" + window.location.hostname + "/v/id/" + linkId);
            }
        })();

        // Attach event listeners for platform clicks
        document.querySelectorAll('.music-link__button--platform-visit').forEach(function(e) {
            e.addEventListener('click', handleServiceClick);
        });

        document.querySelectorAll('.music-link__container--platform-visit').forEach(function(e) {
            e.addEventListener('click', function(element) {
                // Do not double send visit
                if (element.target.classList.contains('music-link__button--platform-visit')) return;
                handleServiceClick(element);
            });
        });

        // handleServiceClick
        function handleServiceClick(e) {

            var sPlatformID = e.target.getAttribute('data-id') || e.target.parentNode.getAttribute('data-id');
            var sPlatform = e.target.getAttribute('data-platform') || e.target.parentNode.getAttribute('data-platform');
            var sPlatformURL = e.target.getAttribute('data-url') || e.target.parentNode.getAttribute('data-url');

            if (!sPlatformID || !sPlatformURL) {
                console.error('handleServiceClick: No platform ID or platform URL');
                return;
            }
            
            // Pixel Custom Events
            if (bFacebookPixel) {
                console.log('Firing Facebook Platform Visit event');
                fbq('trackCustom', 'ListenTo - Platform Visit', {
                    musicservice: sPlatform || 'unknown',
                    musicservice_url: sPlatformURL || 'unknown'
                });
            }

            if (bTwitterPixel) {
                console.log('Firing Twitter Platform Visit event');
                twq('trackCustom', 'ListenTo - Platform Visit', {
                    musicservice: sPlatform || 'unknown',
                    musicservice_url: sPlatformURL || 'unknown'
                });
            }

            if (bGooglePixel) {
                console.log('Firing Google Platform Visit event');
                gtag('event', 'ListenTo - Platform Visit', {
                    send_to: '',
                    musicservice: sPlatform || 'unknown',
                    musicservice_url: sPlatformURL || 'unknown'
                });
            }

            // Log click
            ajaxPOST("/links/platform/visit", { slug: 'its-time-for-war', id: sPlatformID }, function(err, res) {
                // Redirect user
                window.location = ensureURL(sPlatformURL) || '';
            })
            
        }

        // ensureURL
        function ensureURL(url) {

            // If url contains iTunes Store URI scheme, no changes needed
            if ((url.substring(0, 7) === "itms://") || (url.substring(0, 11) === "itms-apps://")) {
                return url;
            }

            // If url contains https://, redirect directly.
            if (url.substring(0, 8) === "https://") {
                return url;

                // If url contains http://, redirect directly.
            } else if (url.substring(0, 7) === "http://") {
                return url;

                // Append http:// and redirect
            } else {
                url = "http://" + url;
            }
            return url;
        }


        // If user uploaded artwork
            // For Classic Theme
                // Insert background image
                document.getElementById('bg_container').style.display = "block";
                document.getElementById('bg_img').src = "https://files.sten.to/image/69e608a36dc1188b76c3e66d/3cba0cf463ff5a21db07ac4fc5bab3d8c772d9d2da51c1637fe457fbee5447a1.jpg";




        // ajaxPOST
        function ajaxPOST(url, body, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open("POST", url, true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.onreadystatechange = function (res) {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    if (typeof callback === 'function') callback(null, JSON.parse(xhr.responseText));
                }
            };
            var data = JSON.stringify(body);
            xhr.send(data);
        }

        // ajaxGET
        function ajaxGET(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function (res) {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        if (typeof callback === 'function') callback(null, JSON.parse(xhr.responseText));
                    } else {
                        if (typeof callback === 'function') callback({ status: xhr.status });
                    }
                }
            };
            xhr.send();
        }

    </script>

                var sPlayIcon = ePlayButton.src;
                ePlayButton.addEventListener('click', function() {
                    if (bPlaying) {
                        eAudio.pause();
                        ePlayButton.src = sPlayIcon;
                        bPlaying = false;
                    } else {
                        eAudio.play();
                        ePlayButton.src = sPauseIcon;
                        bPlaying = true;
                    }
                });
                eAudio.addEventListener('ended', function() {
                    ePlayButton.src = sPlayIcon;
                    bPlaying = false;
                });
            }
        </script>
